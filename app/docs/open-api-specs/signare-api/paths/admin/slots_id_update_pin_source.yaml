post:
  operationId: admin.slots.updatePinSource
  tags:
    - Admin
  summary: Updates the PIN source of the slot
  description: |
    Points the slot at the secret that holds its PIN. The PIN itself is not submitted: Signare resolves
    the named secret at login time. The source is checked against the HSM before it is stored, so a
    name that does not open the slot is rejected here.
  parameters:
    - $ref: '../../components/_index.yaml#/parameters/ModuleId'
    - $ref: '../../components/_index.yaml#/parameters/SlotId'
  requestBody:
    description: The new PIN source of the slot
    content:
      application/json:
        schema:
          $ref: '../../components/_index.yaml#/schemas/SlotUpdatePinSource'
  responses:
    '200':
      description: Slot details
      content:
        application/json:
          schema:
            $ref: '../../components/_index.yaml#/schemas/SlotDetail'
    '400':
      $ref: '../../components/_index.yaml#/responses/BadRequestResponse'
    '403':
      $ref: '../../components/_index.yaml#/responses/PermissionDeniedResponse'
    '404':
      $ref: '../../components/_index.yaml#/responses/NotFoundResponse'
    '500':
      $ref: '../../components/_index.yaml#/responses/InternalServerErrorResponse'
