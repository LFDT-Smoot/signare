type: object
additionalProperties: false
properties:
  meta:
    $ref: '../../_index.yaml#/schemas/ResourceMetaDetail'
  spec:
    type: object
    x-required: mandatory
    additionalProperties: false
    properties:
      hardwareSecurityModuleId:
        type: string
        x-required: mandatory
        description: |
          Identifier of the Hardware Security Module (HSM) where the slot belongs.
      applicationId:
        type: string
        x-required: mandatory
        description: |
          Identifier of the application that owns the slot.
      slot:
        type: string
        x-required: mandatory
        description: |
          Slot number assigned by the HSM.
      pinSource:
        type: string
        x-required: optional
        nullable: true
        description: |
          Name of the secret holding the PIN that provides access to the slot, resolved under the
          configured pin source directory. A reference, not the PIN: the value is never returned.
          Absent for a module kind that does not authenticate with a PIN, and for a slot created
          before pin sources existed.
      config:
        type: array
        x-required: mandatory
        description: collection of configuration objects
        items:
          $ref: '../../_index.yaml#/schemas/SlotDetailConfig'
    required:
      - hardwareSecurityModuleId
      - applicationId
      - slot
      - config

example:
  meta:
    id: 'slot-1'
    resourceVersion: '7e032829-249d-4498-aa3e-344a16cd6a93'
    creationDate: '1581675232372'
    lastUpdate: '1581675232372'
  spec:
    hardwareSecurityModuleId: 'module-1'
    applicationId: 'application-1'
    slot: '342'
    pinSource: 'slot-1-pin'
    config: {}

required:
  - meta
  - spec
