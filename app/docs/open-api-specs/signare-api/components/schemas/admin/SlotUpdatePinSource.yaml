type: object
additionalProperties: false
properties:
  meta:
    $ref: '../../_index.yaml#/schemas/ResourceMetaUpdate'
  spec:
    type: object
    x-required: optional
    nullable: true
    additionalProperties: false
    properties:
      pinSource:
        type: string
        x-required: mandatory
        nullable: false
        description: |
          Name of the secret holding the PIN that provides access to the slot number inside the HSM.
          A single name, with no path separators, resolved under the directory configured in
          hsmmodules.softhsm.pinSourceDirectory. The PIN itself is never sent to or stored by Signare.
    required:
      - pinSource

example:
  meta:
    resourceVersion: '7e032829-249d-4498-aa3e-344a16cd6a93'
  spec:
    pinSource: 'slot-1-pin'

required:
  - meta
  - spec
