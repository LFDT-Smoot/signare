type: object
additionalProperties: false
properties:
  meta:
    $ref: '../../_index.yaml#/schemas/ResourceMetaCreation'
  spec:
    type: object
    x-required: mandatory
    nullable: false
    additionalProperties: false
    properties:
      applicationId:
        type: string
        x-required: mandatory
        nullable: false
        description: |
          Identifier of the application that owns the slot.
      slot:
        type: string
        x-required: optional
        nullable: true
        description: |
          Slot number assigned by the HSM.
      pinSource:
        type: string
        x-required: optional
        nullable: true
        description: |
          Name of the secret holding the PIN that provides access to the slot number inside the HSM.
          A single name, with no path separators, resolved under the directory configured in
          hsmmodules.softhsm.pinSourceDirectory. Mandatory for a SoftHSM module and rejected for the
          others, which do not authenticate with a PIN. The PIN itself is never sent to or stored by
          Signare.
      config:
        type: array
        x-required: optional
        nullable: true
        description: collection of config
        items:
          $ref: '../../_index.yaml#/schemas/SlotDetailConfig'
    required:
    - applicationId

example:
  meta:
    id: 'slot-1'
  spec:
    applicationId: 'application-1'
    slot: '342'
    pinSource: 'slot-1-pin'
    configMap: {}

required:
  - spec
