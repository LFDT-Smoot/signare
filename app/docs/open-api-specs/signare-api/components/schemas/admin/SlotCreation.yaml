type: object
additionalProperties: false
properties:
  meta:
    $ref: '../../_index.yaml#/schemas/ResourceMetaCreation'
  spec:
    type: object
    x-required: mandatory
    nullable: false
    additionalProperties: false
    properties:
      applicationId:
        type: string
        x-required: mandatory
        nullable: false
        description: |
          Identifier of the application that owns the slot.
      slot:
        type: string
        x-required: optional
        nullable: true
        description: |
          Slot number assigned by the HSM.
      pin:
        type: string
        x-required: optional
        nullable: true
        description: |
          PIN that provides access to the slot number inside the HSM.
      config:
        type: array
        x-required: optional
        nullable: true
        description: collection of config
        items:
          $ref: '../../_index.yaml#/schemas/SlotDetailConfig'
    required:
    - applicationId

example:
  meta:
    id: 'slot-1'
  spec:
    applicationId: 'application-1'
    slot: '342'
    pin: '123'
    configMap: {}

required:
  - spec
