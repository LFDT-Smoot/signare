actions:
  # One action per JSON-RPC method, which is what the infra generator does not produce. Nothing else
  # belongs here: this file is also the rbac-validator's list of actions exempt from the API spec
  # check, so the RBAC coverage tests reject an entry that names no method in SupportedMethods.
  - rpc.method.eth_generateAccount
  - rpc.method.eth_importAccount
  - rpc.method.eth_removeAccount
  - rpc.method.eth_accounts
  - rpc.method.eth_signTransaction
  - rpc.method.eth_signTypedData
  - rpc.method.personal_sign
