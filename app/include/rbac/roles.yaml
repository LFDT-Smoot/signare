roles:
  - id: signer-admin
    description: Administrator of the signare
    scope: admin
    permissions:
      - allow-admin-actions
  - id: application-admin
    description: Admin of an application
    scope: application
    permissions:
      - allow-application-admin-actions
  - id: transaction-signer
    description: User of a given application with  signing permissions
    scope: application
    permissions:
      - allow-user-transaction-sign-actions
  - id: message-signer
    description: User of a given application with EIP-191 personal message signing permissions
    scope: application
    permissions:
      - allow-user-personal-sign-actions
