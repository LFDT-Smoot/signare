logger:
  logLevel: 'info'
database:
  postgresql:
    host: 'localhost'
    port: 5432
    scheme: 'postgres'
    database: 'db_signare'
    # Use a dedicated low-privilege role that owns db_signare, not the postgres superuser.
    username: 'signare'
    # Do not store the password here. Supply it via the SIGNARE_DATABASE_POSTGRESQL_PASSWORD
    # environment variable. This placeholder is intentionally invalid so a copy-paste deployment that
    # forgets to set the variable fails to connect instead of silently using a known value.
    password: '__CHANGE_ME__'
    # 'require' encrypts the connection; use 'verify-full' to also validate the server certificate.
    sslmode: 'require'
requestContext:
  userRequestHeader: 'X-Auth-RpcUserId'
  applicationRequestHeader: 'X-Auth-RpcApplicationId'
metrics:
  prometheus:
    port: 9092
    path: /metrics
    maxRequestInFlight: 10
    timeoutInMillis: 30000
    namespace: 'signer'
hsmmodules:
  softhsm:
    lib: '/usr/local/lib/softhsm/libsofthsm2.so'
    # Directory holding one file per slot PIN. A slot records the file name, never the PIN itself.
    # Mount these read-only to the Signare process alone.
    pinSourceDirectory: '/etc/signare/slot-pins'
server:
  maxRequestBodyBytes: 1048576
  maxHeaderBytes: 1048576
